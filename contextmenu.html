<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>contextmenu - Right-click</h1>
    <p>Right-click the box. preventDefault() stop the browser's normal context menu for this element.</p>
    <div id="target" class="box">Right-click me.<br>
        <strong>This is a child element.</strong>
    </div><p id="result" class="result">Waiting...</p>
    <script>
        const target=document.querySelector("#target");
        const result=document.querySelector("#result");
        target.addEventListener("contextmenu", (event) =>{
            event.preventDefault();
            result.textContent="custom Right-click action";
            target.style.backgroundColor="#e9d5ff"
        });
    </script>
</body>
</html>
