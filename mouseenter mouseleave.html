<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>mouseenter and mouseleave</h1>
    <p>These events are useful for hover behaviour and do not retrigger
    just because the pointer moves between child elements.</p>
    <div id="target" class="box">Move in and out.<br>
        <strong>This is a child element.</strong>
    </div><p id="result" class="result">Waiting...</p>
    <script>
        const target=document.querySelector("#target");
        const result=document.querySelector("#result");
        target.addEventListener("mouseenter", () =>{
            target.style.backgroundColor="#bbf7d0";
            result.textContent="mouseenter pointer entered the box  ";
        });
        target.addEventListener("mouseleave", () =>{
            target.style.backgroundColor="#dbeafe";
            result.textContent="mouseleave pointer left the box";
        });
    </script>
</body>
</html>
