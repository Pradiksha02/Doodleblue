<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>mouseover and mouseout</h1>
    <p>move the pointer over the box and then away. These events can also fire around child elements.</p>
    <div id="target" class="box">Move your pointer over me.<br>
        <strong>Try moving over this child text.</strong>
    </div><p id="result" class="result">Waiting...</p>
    <script>
        const target=document.querySelector("#target");
        const result=document.querySelector("#result");
        target.addEventListener("mouseover", () =>{
            target.style.backgroundColor="#fed7aa";
            result.textContent="mouseover fired";
        });
        target.addEventListener("mouseout", () =>{
            target.style.backgroundColor="#dbeafe";
            result.textContent="mouseout fired";
        });
    </script>
</body>
</html>
